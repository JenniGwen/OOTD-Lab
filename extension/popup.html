<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>OOTD-Lab Try-On</title>
  <style>
    * { box-sizing: border-box; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { width: 320px; margin: 0; padding: 16px; background: #F8F6EC; color: #191919; font-size: 13px; }
    h1 { margin: 0 0 2px; font-size: 16px; }
    h1 span { color: #7A2117; }
    .sub { margin: 0 0 12px; color: #96948B; font-size: 11px; }
    .card { background: #fff; border: 1px solid #C8D9A5; border-radius: 14px; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    .title { font-size: 12px; font-weight: 600; margin: 0; }
    label { font-size: 11px; color: #96948B; display: block; }
    input { width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid #C8D9A5; border-radius: 10px; font-size: 13px; background: #fff; color: #191919; }
    .primary { width: 100%; padding: 10px; border: 0; border-radius: 999px; background: #7A2117; color: #fff; font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
    .primary:disabled { opacity: .5; }
    .ghost { padding: 7px 10px; border: 1px solid #C8D9A5; border-radius: 999px; background: #fff; font-size: 12px; cursor: pointer; color: #191919; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .choice[aria-checked="true"] { background: #7A2117; border-color: #7A2117; color: #fff; }
    .error { color: #7A2117; font-size: 12px; margin: 0; }
    .muted { color: #96948B; font-size: 11px; margin: 0; line-height: 1.4; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .preview { width: 64px; height: 86px; object-fit: cover; border-radius: 8px; border: 1px solid #C8D9A5; background: #F2F7E8; }
    details summary { cursor: pointer; font-size: 11px; color: #96948B; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Try-On · <span>OOTD-Lab</span></h1>
  <p class="sub">Coba baju dari toko online mana pun.</p>

  <div id="main">
    <div class="card">
      <p class="title">Model</p>
      <div class="grid" role="radiogroup" aria-label="Model try-on">
        <button class="ghost choice" type="button" role="radio" data-model="female">Perempuan</button>
        <button class="ghost choice" type="button" role="radio" data-model="male">Laki-laki</button>
        <button class="ghost choice" type="button" role="radio" data-model="own">Foto saya</button>
      </div>
      <div class="row">
        <img id="own-preview" class="preview" alt="Foto kamu" hidden>
        <div style="flex:1">
          <button id="upload" class="ghost" type="button" style="width:100%">Upload foto full body (opsional)</button>
          <p class="muted" style="margin-top:6px">Berdiri, menghadap kamera, seluruh badan terlihat.</p>
        </div>
      </div>
      <input id="file" type="file" accept="image/*" hidden>
      <p id="model-error" class="error" hidden></p>
    </div>

    <div class="card">
      <p class="title">Badan kamu <span class="muted">(opsional)</span></p>
      <div class="grid2">
        <label>Tinggi (cm)<input id="height" type="number" min="120" max="220" inputmode="numeric"></label>
        <label>Berat (kg)<input id="weight" type="number" min="30" max="200" inputmode="numeric"></label>
      </div>
    </div>

    <p class="muted">Arahkan kursor ke foto produk di toko online lalu klik <b>✦ Try-On</b>, atau klik kanan gambar → <b>Try-On dengan OOTD-Lab</b>.</p>
  </div>

  <details class="card" style="margin-top:10px">
    <summary>Pengaturan server</summary>
    <label>URL server OOTD-Lab<input id="app-url" type="url" placeholder="https://ootd-lab-ivory.vercel.app"></label>
    <button id="save-url" class="ghost" type="button">Simpan</button>
    <p id="server-status" class="muted"></p>
  </details>

  <script src="popup.js"></script>
</body>
</html>
